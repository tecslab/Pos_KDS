name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Quality checks and build
    runs-on: ubuntu-latest
    env:
      # Nonfunctional build-time placeholders; this workflow does not connect to Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://typecheck.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_typecheck
      SUPABASE_SECRET_KEY: ${{ format('sb_{0}ci-placeholder', 'secret_') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Build application
        run: npm run build
